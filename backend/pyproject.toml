[project]
name = "framewise-backend"
version = "0.1.0"
description = "Framewise backend - TwelveLabs + OpenAI + Strands + Neo4j"
requires-python = ">=3.10, <3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "neo4j>=5.20",
    "twelvelabs>=1.2,<2",
    "openai>=1.40",
    "strands-agents[anthropic,openai]>=0.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # for fastapi.testclient.TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
