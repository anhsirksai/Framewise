# Fly.io config for the Framewise backend.
# Deploy from backend/:  fly deploy
# Secrets (set once):    fly secrets set KEY=value ...

app = "framewise-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_PROVIDER = "anthropic"
  TL_INDEX_NAME = "framewise"
  DOMAIN_ID = "framewise"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"     # scale to zero between demos
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
